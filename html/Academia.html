<head>
  <script>
    /* @name window.GOOGLE_DATA */
    /* @type {Object} */
    /* @description Datos de ejemplo para el objeto window.GOOGLE_DATA. */
    // Aqui se define el objeto window.GOOGLE_DATA.
    // Google utiliza interpolacion para inyectar el objeto en el HTML,
    // pero la cadena de texto que inyecta no es un objeto valido para
    // este formato de archivo HTML.
    // Por eso, aqui utilizamos un objeto con datos de ejemplo.
    // Al subir el archivo Index.html a Google Sites,
    // reemplazamos la definicion de window.GOOGLE_DATA en Google Scripts
    // con el siguiente codigo:

    // window.GOOGLE_DATA = <?= JSON.stringify(data) ?>;

    // (Nota): Para que el codigo en Google Scripts funcione correctamente,
    // el objeto `data` debe tener las mismas propiedades que los datos
    // de ejemplo aqui definidos.

    // Datos de ejemplo para el objeto window.GOOGLE_DATA.
    window.GOOGLE_DATA = {
      title: "Growith - Business Academy",
      assets: {
        heroBg:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/hero-bg.png",
        growithLogo:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/logo-growith.png",
        businessAcademyLogo:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/logo-business-academy.png",
      },
      evento: {
        fecha: "30 de Julio",
        hora: "10:00 AM",
        url: "https://www.google.com",
        textoBtn: "Contactanos",
        textoIzq: "Suscribete a nuestro proximo evento",
        titulo: "Evento de academia en Growith - Presencial (Merida, Yucatan)",
        descripcion:
          "Este es un evento publico realizado por Growith, donde se impartiran conocimientos basicos para el crecimiento de tu negocio.",
      },
    };

    function cn(...classes) {
      return classes.filter(Boolean).join(" ");
    }
  </script>

  <!-- Tailwind V3  -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <!-- Tailwind V4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
  />
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --brand-color: #09593a;
      --font-sans: "Montserrat", sans-serif;
    }
    body {
      font-family: var(--font-sans) !important;
    }
    .tc-brand {
      color: var(--brand-color);
    }

    .bc-brand {
      background-color: var(--brand-color);
    }

    .material-symbols-outlined {
      font-size: 30px;
    }
  </style>
</head>

<body className="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    // Componente principal
    function App({ data }) {
      return (
        <div>
          <Hero assets={data.assets} />
          <Evento data={data.evento} />
          <EspacioDeTrabajo />
          <ImplementacionesDestacadas />
          <Reuniones assets={data.assets} />
        </div>
      );
    }

    function Hero({ assets }) {
      return (
        <div
          className={cn(
            "h-[20rem] text-white text-center flex flex-col items-center justify-center",
            `bg-cover bg-center`,
          )}
          style={{ backgroundImage: `url(${assets.heroBg})` }}
        >
          <p>{"Bienvenido a"}</p>
          <img
            src={assets.businessAcademyLogo}
            alt="Business Academy Logo"
            className="h-10 object-contain"
          />
          <p>{"El crecimiento que estas buscando, esta en tus manos..."}</p>
          <img
            src={assets.growithLogo}
            alt="Growith Logo"
            className="h-10 object-contain"
          />
        </div>
      );
    }

    function Evento({ data }) {
      return (
        <>
          {/* Version mobil */}
          <section className="flex items-start gap-[1rem] md:hidden w-full">
            <div className="w-[65%] flex flex-col gap-2">
              <h3 className="text-lg font-bold">{data.titulo}</h3>

              <div className="w-[100%] flex justify-between font-bold">
                <div className="flex items-center gap-1">
                  <span
                    className="material-symbols-outlined"
                    style={{ fontSize: "20px" }}
                  >
                    {" "}
                    event_available{" "}
                  </span>
                  <span className="text-sm"> {data.fecha} </span>
                </div>

                <div className="flex items-center gap-1">
                  <span
                    className="material-symbols-outlined"
                    style={{ fontSize: "20px" }}
                  >
                    {" "}
                    schedule{" "}
                  </span>
                  <span className="text-sm">{data.hora}</span>
                </div>
              </div>
            </div>

            <button
              className="w-[35%] bc-brand rounded rounded-md py-1 px-3 text-white text-center"
              type="button"
            >
              <a target="_blank" href={data.url}>
                {data.textoBtn}
              </a>
            </button>
          </section>

          {/* Version de escritorio */}
          <section className="hidden h-[20rem] md:flex gap-[2rem] w-full items-center justify-between">
            <p className="w-[20%] font-medium tc-brand text-2xl">
              {data.textoIzq}
            </p>

            <div className="w-[60%] flex justify-center items-center text-center">
              <div className="flex flex-col gap-3 w-[75%] h-full">
                <h3 className="text-3xl font-bold">{data.titulo}</h3>
                <p>{data.descripcion}</p>
                <div className="w-[100%] flex justify-between font-bold">
                  <div className="flex items-center gap-2">
                    <span className="material-symbols-outlined">
                      {" "}
                      event_available{" "}
                    </span>
                    <span> {data.fecha} </span>
                  </div>

                  <div className="flex items-center gap-2">
                    <span className="material-symbols-outlined">
                      {" "}
                      schedule{" "}
                    </span>
                    <span>{data.hora}</span>
                  </div>
                </div>
              </div>
            </div>

            <div className="w-[20%] flex justify-end">
              <button
                className="bc-brand rounded rounded-md py-1 px-3 text-white text-center"
                type="button"
              >
                <a target="_blank" href={data.url}>
                  {data.textoBtn}
                </a>
              </button>
            </div>
          </section>
        </>
      );
    }

    function EspacioDeTrabajo() {
      return (
        <section className="w-full bg-gray-200 flex justify-around items-center">
          <div>
            <h3>{"Este es tu espacio de trabajo"}</h3>
            <Skeleton title="Logo" h="10rem" />
            <button>{"Sube aqui tus implementaciones"}</button>
          </div>

          <div>
            <h4>{"CALENDARIO BUSINESS ACADEMY"}</h4>
            <h4>{"MARZO 2026"}</h4>
            <Skeleton title="Calendario" h="30rem" />
            <button>{"Ver calendario"}</button>
          </div>
        </section>
      );
    }

    function ImplementacionesDestacadas() {
      return (
        <section className="w-full grid grid-cols-3 justify-around items-center">
          <h3>{"Encuentra aqui tus implementaciones mas destacadas"}</h3>
          <div className="col-span-2">
            <Skeleton title="Implementacion 1" h="20rem" />
          </div>
        </section>
      );
    }

    function Reuniones({ assets }) {
      return (
        <section
          className="w-full text-white flex flex-col justify-around items-center"
          style={{ backgroundImage: `url(${assets.heroBg})` }}
        >
          <p>{"Mantente al tanto de nuestras reuniones"}</p>
          <h3>{"Todos los Jueves a las 10:00 AM"}</h3>
          <button>{"LLAMADA SEMANAL"}</button>
        </section>
      );
    }

    function Skeleton({ title, w = "100%", h = "100%" }) {
      return (
        <div
          className={cn(
            "bg-gray-300 rounded-md flex justify-center items-center",
          )}
          style={{ width: w, height: h }}
        >
          <h3 className="text-lg font-bold">{title}</h3>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <App data={window.GOOGLE_DATA} />,
    );
  </script>
</body>
