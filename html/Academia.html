<head>
  <script>
    /* @name window.GOOGLE_DATA */
    /* @type {Object} */
    /* @description Datos de ejemplo para el objeto window.GOOGLE_DATA. */
    // Aqui se define el objeto window.GOOGLE_DATA.
    // Google utiliza interpolacion para inyectar el objeto en el HTML,
    // pero la cadena de texto que inyecta no es un objeto valido para
    // este formato de archivo HTML.
    // Por eso, aqui utilizamos un objeto con datos de ejemplo.
    // Al subir el archivo Index.html a Google Sites,
    // reemplazamos la definicion de window.GOOGLE_DATA en Google Scripts
    // con el siguiente codigo:

    // window.GOOGLE_DATA = <?= JSON.stringify(data) ?>;

    // (Nota): Para que el codigo en Google Scripts funcione correctamente,
    // el objeto `data` debe tener las mismas propiedades que los datos
    // de ejemplo aqui definidos.

    // Datos de ejemplo para el objeto window.GOOGLE_DATA.
    window.GOOGLE_DATA = {
      title: "Growith - Business Academy",
      assets: {
        heroBg:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/hero-bg.png",
        growithLogo:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/logo-growith.png",
        businessAcademyLogo:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/logo-business-academy.png",
        letsGrowith:
          "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/lets-growith.png",
      },
      evento: {
        fecha: "30 de Julio",
        hora: "10:00 AM",
        url: "https://www.google.com",
        textoBtn: "Contactanos",
        textoIzq: "Suscribete a nuestro proximo evento",
        titulo: "Evento de academia en Growith - Presencial (Merida, Yucatan)",
        descripcion:
          "Este es un evento publico realizado por Growith, donde se impartiran conocimientos basicos para el crecimiento de tu negocio.",
      },
    };

    function cn(...classes) {
      return classes.filter(Boolean).join(" ");
    }
  </script>

  <!-- Tailwind V3  -->
  <!-- <script src="https://cdn.tailwindcss.com"></script> -->
  <!-- Tailwind V4 -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Material Symbols -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
  />
  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --font-sans: "Montserrat", sans-serif;

      --text-off-white: #f2f1ef;
      --text-stone: #e1e1db;
      --text-forest-green: #396743;
      --text-dark-green: #1f3a26;
      --text-night: #0d0f0e;
    }
    html {
      font-family: var(--font-sans) !important;
      color: var(--text-night);
      background-color: var(--text-off-white);
    }
    .text-white {
      color: var(--text-off-white);
    }
    .bg-white {
      background-color: var(--text-off-white);
    }
    .tc-primary {
      color: var(--text-forest-green);
    }
    .tc-white {
      color: var(--text-off-white);
    }
    .tc-stone {
      color: var(--text-stone);
    }
    .tc-forest-green {
      color: var(--text-forest-green);
    }
    .tc-dark-green {
      color: var(--text-dark-green);
    }
    .tc-night {
      color: var(--text-night);
    }

    .bgc-primary {
      background-color: var(--text-forest-green);
    }
    .bgc-white {
      background-color: var(--text-off-white);
    }
    .bgc-stone {
      background-color: var(--text-stone);
    }
    .bgc-forest-green {
      background-color: var(--text-forest-green);
    }
    .bgc-dark-green {
      background-color: var(--text-dark-green);
    }
    .bgc-night {
      background-color: var(--text-night);
    }

    .material-symbols-outlined {
      font-size: 30px;
    }
  </style>
</head>

<body className="bg-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    // Componente principal
    function App({ data }) {
      return (
        <div>
          <Hero assets={data.assets} />
          <Evento data={data.evento} />
          <EspacioDeTrabajo />
          <ImplementacionesDestacadas />
          <Reuniones assets={data.assets} />
        </div>
      );
    }

    function Hero({ assets }) {
      return (
        <div
          className={cn(
            "h-[20rem] text-white text-center flex flex-col items-center justify-center",
            `bg-cover bg-center`,
          )}
          style={{ backgroundImage: `url(${assets.heroBg})` }}
        >
          <p>{"Bienvenido a"}</p>
          <img
            src={assets.businessAcademyLogo}
            alt="Business Academy Logo"
            className="h-10 object-contain"
          />
          <p>{"El crecimiento que estas buscando, esta en tus manos..."}</p>
          <img
            src={assets.letsGrowith}
            alt="Lets Growith"
            className="h-10 object-contain"
          />
        </div>
      );
    }

    function Evento({ data }) {
      return (
        <>
          {/* Version mobil */}
          <Section className="flex items-start gap-[1rem] md:hidden">
            <div className="w-[65%] flex flex-col gap-2">
              <h3 className="text-lg font-bold">{data.titulo}</h3>

              <div className="w-[100%] flex justify-between font-bold">
                <div className="flex items-center gap-1">
                  <span
                    className="material-symbols-outlined"
                    style={{ fontSize: "20px" }}
                  >
                    {" "}
                    event_available{" "}
                  </span>
                  <span className="text-sm"> {data.fecha} </span>
                </div>

                <div className="flex items-center gap-1">
                  <span
                    className="material-symbols-outlined"
                    style={{ fontSize: "20px" }}
                  >
                    {" "}
                    schedule{" "}
                  </span>
                  <span className="text-sm">{data.hora}</span>
                </div>
              </div>
            </div>

            <Button
              variant="primary"
              className="w-[35%]"
              asLink={true}
              href={data.url}
            >
              {data.textoBtn}
            </Button>
          </Section>

          {/* Version de escritorio */}
          <Section className="hidden h-[20rem] md:flex gap-[2rem] items-center justify-between">
            <Text variant="h3" className="w-[20%] font-medium tc-primary">
              {data.textoIzq}
            </Text>

            <div className="w-[60%] flex justify-center items-center text-center">
              <div className="flex flex-col gap-3 w-[75%] h-full">
                <Text variant="h2" className="font-bold">
                  {data.titulo}
                </Text>
                <Text variant="p">{data.descripcion}</Text>
                <div className="w-[100%] flex justify-between font-bold">
                  <div className="flex items-center gap-2">
                    <Text
                      variant="p"
                      inline
                      className="material-symbols-outlined"
                    >
                      {"event_available"}
                    </Text>
                    <Text variant="p" inline>
                      {data.fecha}
                    </Text>
                  </div>

                  <div className="flex items-center gap-2">
                    <Text
                      variant="p"
                      inline
                      className="material-symbols-outlined"
                    >
                      {"schedule"}
                    </Text>
                    <Text variant="p" inline>
                      {data.hora}
                    </Text>
                  </div>
                </div>
              </div>
            </div>

            <div className="w-[20%] flex justify-end">
              <Button variant="primary" asLink={true} href={data.url}>
                {data.textoBtn}
              </Button>
            </div>
          </Section>
        </>
      );
    }

    function EspacioDeTrabajo() {
      return (
        <Section
          parentClass={"bgc-stone"}
          className="flex justify-between items-center"
        >
          <div>
            <Text variant="h3">{"Este es tu espacio de trabajo"}</Text>
            <Skeleton title="Logo" h="10rem" />
            <Button variant="primary">
              {"Sube aqui tus implementaciones"}
            </Button>
          </div>

          <div>
            <Text variant="h4">{"CALENDARIO BUSINESS ACADEMY"}</Text>
            <Text variant="h4">{"MARZO 2026"}</Text>
            <Skeleton title="Calendario" h="30rem" />
            <Button variant="primary">{"Ver calendario"}</Button>
          </div>
        </Section>
      );
    }

    function ImplementacionesDestacadas() {
      return (
        <Section className="grid grid-cols-3 justify-around items-center">
          <Text variant="h3">
            {"Encuentra aqui tus implementaciones mas destacadas"}
          </Text>
          <div className="col-span-2">
            <Skeleton title="Implementacion 1" h="20rem" />
          </div>
        </Section>
      );
    }

    function Reuniones({ assets }) {
      return (
        <Section
          className="text-white flex flex-col justify-around items-center"
          style={{ backgroundImage: `url(${assets.heroBg})` }}
        >
          <Text variant="p">{"Mantente al tanto de nuestras reuniones"}</Text>
          <Text variant="h3">{"Todos los Jueves a las 10:00 AM"}</Text>
          <Button variant="light">{"LLAMADA SEMANAL"}</Button>
        </Section>
      );
    }

    function Text({ variant = "p", children, className, inline = false }) {
      const fontSizeMap = {
        p: "text-base",
        h1: "text-4xl",
        h2: "text-3xl",
        h3: "text-2xl",
        h4: "text-xl",
        h5: "text-lg",
        h6: "text-base",
        sm: "text-sm",
        xs: "text-xs",
      };
      const props = {
        className: cn(fontSizeMap[variant], className),
      };
      return inline === true ? (
        <span {...props}>{children}</span>
      ) : (
        <p {...props}>{children}</p>
      );
    }

    function Button({
      variant = "primary",
      children,
      className,
      asLink = false,
      href = "",
      target = "_blank",
    }) {
      const variantMap = {
        primary: "bgc-primary tc-white",
        light: "bgc-white tc-primary",
        dark: "bgc-night tc-white",
      };
      const props = {
        className: cn(
          variantMap[variant],
          "rounded-sm py-1 px-3 text-center",
          className,
        ),
      };
      if (asLink === true) {
        return (
          <a target={target} href={href} {...props}>
            {children}
          </a>
        );
      }
      return <button {...props}>{children}</button>;
    }

    function Section({ children, className, parentClass, ...props }) {
      return (
        <section className={cn("w-full", parentClass)} {...props}>
          <div className={cn("w-[80%] mx-auto", className)}>{children}</div>
        </section>
      );
    }

    function Skeleton({ title, w = "100%", h = "100%" }) {
      return (
        <div
          className={cn(
            "bg-gray-300 rounded-md flex justify-center items-center",
          )}
          style={{ width: w, height: h }}
        >
          <Text variant="h3" className="opacity-50 font-medium">
            {title}
          </Text>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <App data={window.GOOGLE_DATA} />,
    );
  </script>
</body>
