<!doctype html>
<html>
  <head>
    <base target="_top" />

    <!-- Estas lineas son ignoradas por Google Scripts. -->
    <!-- Se crea una template y se encadenan los metodos: -->
    <!-- setTitle y addMetaTag. -->
    <title>Growith | Academia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script>
      /* @name window.GOOGLE_DATA */
      /* @type {Object} */
      /* @description Datos de ejemplo para el objeto window.GOOGLE_DATA. */
      // Aqui se define el objeto window.GOOGLE_DATA.
      // Google utiliza interpolacion para inyectar el objeto en el HTML,
      // pero la cadena de texto que inyecta no es un objeto valido para
      // este formato de archivo HTML.
      // Por eso, aqui utilizamos un objeto con datos de ejemplo.

      // (Nota): Para que el codigo en Google Scripts funcione correctamente,
      // el objeto `data` debe tener las mismas propiedades que los datos
      // de ejemplo aqui definidos.

      // Datos de ejemplo para el objeto window.GOOGLE_DATA.
      window.GOOGLE_DATA = {
        mainURL:
          "https://script.google.com/macros/s/AKfycbwAxw19XTIs-t0ncuVZu7Nj0GS8hRfQG8o1619keX6N9EWatZvz3JYEMQE1G9pYbstG/exec",
        assets: {
          heroBg:
            "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/hero-bg.png",
          growithLogo:
            "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/logo-growith.png",
          businessAcademyLogo:
            "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/logo-business-academy.png",
          letsGrowith:
            "https://cdn.jsdelivr.net/gh/mezacanul/growith@main/assets/academia/lets-growith.png",
        },
        clients: [
          {
            id: "soferp",
            period: "marzo",
            year: 2026,
            modality: "presencial",
            dayOfCall: "jueves",
            timeOfCall: "11:00 am",
            meetURL: "https://meet.google.com/pqp-xmcc-czi",
            impURL:
              "https://drive.google.com/drive/folders/12Rd5E0SLKetEJb_Vz4DQV28VICtxjIx6?usp=drive_link",
            impDestacadasURL:
              "https://drive.google.com/drive/folders/1mMqB-DejHbMszssW36U7Gx1qbTCyMt6q?usp=drive_link",
          },
        ],
      };

      // Al subir el archivo Index.html a Google Sites,
      // reemplazamos la definicion de window.GOOGLE_DATA en Google Scripts
      // con el siguiente codigo:

      const jsonData = <?= data ?>;
      window.GOOGLE_DATA = JSON.parse(jsonData)

      console.log("Google Data typeof:", typeof window.GOOGLE_DATA);
      console.log("Google Data:", window.GOOGLE_DATA);

      function cn(...classes) {
        return classes.filter(Boolean).join(" ");
      }
    </script>

    <!-- Tailwind V3  -->
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <!-- Tailwind V4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Material Symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --font-sans: "Montserrat", sans-serif;

        --text-off-white: #f2f1ef;
        --text-stone: #e1e1db;
        --text-forest-green: #396743;
        --text-dark-green: #1f3a26;
        --text-night: #0d0f0e;
      }
      html {
        font-family: var(--font-sans) !important;
        color: var(--text-night);
        background-color: var(--text-off-white);
        scroll-behavior: smooth;
      }
      body {
        overflow-x: hidden;
      }
      .text-white {
        color: var(--text-off-white);
      }
      .bg-white {
        background-color: var(--text-off-white);
      }
      .tc-primary {
        color: var(--text-forest-green);
      }
      .tc-white {
        color: var(--text-off-white);
      }
      .tc-stone {
        color: var(--text-stone);
      }
      .tc-forest-green {
        color: var(--text-forest-green);
      }
      .tc-dark-green {
        color: var(--text-dark-green);
      }
      .tc-night {
        color: var(--text-night);
      }

      .bgc-primary {
        background-color: var(--text-forest-green);
      }
      .bgc-white {
        background-color: var(--text-off-white);
      }
      .bgc-stone {
        background-color: var(--text-stone);
      }
      .bgc-forest-green {
        background-color: var(--text-forest-green);
      }
      .bgc-dark-green {
        background-color: var(--text-dark-green);
      }
      .bgc-night {
        background-color: var(--text-night);
      }

      .material-symbols-outlined {
        font-size: 30px;
      }
    </style>
  </head>

  <body className="bg-slate-100">
    <div id="root"></div>

    <script type="text/babel">
      // Importamos useState y useEffect como objetos de React
      const { useState, useEffect } = React;

      // Componente principal
      function App({ data }) {
        return (
          <div className="text-primary flex flex-col gap-4">
            <Hero assets={data.assets} />
            <ClientsList mainURL={data.mainURL} clients={data.clients} />
          </div>
        );
      }

      function Hero({ assets }) {
        return (
          <div
            style={{ backgroundImage: `url(${assets.heroBg})` }}
            className={cn(
              "w-full flex flex-col gap-4 bg-cover bg-center bg-no-repeat",
              "h-[20rem] items-center justify-center",
              "p-6",
            )}
          >
            <img
              className="w-full"
              src={assets.businessAcademyLogo}
              alt="Hero"
            />
            <img className="w-[8rem]" src={assets.growithLogo} alt="Hero" />
          </div>
        );
      }

      function ClientsList({ mainURL, clients }) {
        const grouped = clients.reduce((acc, client) => {
          const group = `${client.period}-${client.year}-${client.modality}`;
          acc[group] = acc[group] || [];
          acc[group].push(client);
          return acc;
        }, {});

        function getGroupTitle(groupKey) {
          const [period, year, modality] = groupKey.split("-");
          return `${toTitleCase(period)} ${year} - ${toTitleCase(modality)}`;
        }

        return (
          <div className="flex flex-col gap-8 p-10">
            <Text variant="h3" className="text-center">
              Lista de Websites Academia
            </Text>

            {Object.keys(grouped).map((groupKey) => (
              <div key={groupKey} className="w-full flex flex-col gap-4">
                <Text variant="h4" className="font-semibold">
                  {getGroupTitle(groupKey)}
                </Text>
                <div className="w-full flex flex-col gap-4">
                  {grouped[groupKey].map((client) => (
                    <Client key={client.id} client={client} mainURL={mainURL} />
                  ))}
                </div>
              </div>
            ))}
          </div>
        );
      }

      function Client({ client, mainURL }) {
        function copyURL() {
          navigator.clipboard.writeText(`${mainURL}?id=${toClientID(client.id)}`);
          alert("URL copiada al portapapeles");
        }
        function toClientID(clientSTR){
          return clientSTR.replace(/ /g, "-").toLowerCase();
        }
        return (
          <div key={client.id} className="w-full flex flex-col gap-3">
            <div className="flex gap-2 items-center">
              <span
                className="material-symbols-outlined text-blue-700"
                title="Sitio web"
                style={{ fontSize: "22px" }}
              >
                language
              </span>
              <a
                target="_blank"
                className="text-blue-700 text-lg font-semibold"
                href={`${mainURL}?id=${toClientID(client.id)}`}
              >
                {toTitleCase(client.id)}
              </a>
            </div>
            <Button className="w-[10rem] text-sm" onClick={copyURL}>
              {"Copiar URL"}
            </Button>
            {/* <div className="flex gap-2">
              <p>{toTitleCase(client.period)}</p>
              <p>{client.year}</p>
              <p>{toTitleCase(client.modality)}</p>
            </div> */}
          </div>
        );
      }

      // ------------------------------
      // Componentes reutilizables
      // ------------------------------
      // Text
      // Button
      // Section
      // IFrame
      // Skeleton
      // ------------------------------
      function Text({
        variant = "p",
        children,
        className,
        inline = false,
        ...props
      }) {
        const fontSizeMap = {
          p: "text-base",
          h1: "text-4xl",
          h2: "text-3xl",
          h3: "text-2xl",
          h4: "text-xl",
          h5: "text-lg",
          h6: "text-base",
          sm: "text-sm",
          xs: "text-xs",
        };
        const spreadProps = {
          className: cn(fontSizeMap[variant], className),
          ...props,
        };
        return inline === true ? (
          <span {...spreadProps}>{children}</span>
        ) : (
          <p {...spreadProps}>{children}</p>
        );
      }

      function Button({
        variant = "primary",
        children,
        className,
        asLink = false,
        href = "",
        target = "_blank",
        onClick = () => {},
      }) {
        const variantMap = {
          primary: "bgc-primary tc-white",
          light: "bgc-white tc-primary",
          dark: "bgc-night tc-white",
        };
        const spreadProps = {
          className: cn(
            variantMap[variant],
            "rounded-sm py-2 px-5 text-center",
            "text-base font-bold",
            "transition-all duration-300",
            "hover:scale-105",
            "uppercase",
            "shadow-sm",
            "hover:cursor-pointer",
            className,
          ),
          onClick: onClick,
        };
        if (asLink === true) {
          return (
            <a target={target} href={href} {...spreadProps}>
              {children}
            </a>
          );
        }
        return <button {...spreadProps}>{children}</button>;
      }

      function Section({ children, className, parentClass, ...props }) {
        return (
          <section
            className={cn("w-full flex justify-center", parentClass)}
            {...props}
          >
            <div className={cn("w-[85%] lg:w-[80%] lg:mx-auto", className)}>
              {children}
            </div>
          </section>
        );
      }

      function IFrame({ src, className }) {
        return (
          <iframe
            src={src}
            className={cn(
              "w-full h-full",
              "bg-[#FFFFFF] rounded-md shadow-md border-4 border-gray-300",
              className,
            )}
          ></iframe>
        );
      }

      function Skeleton({ title, w = "100%", h = "100%" }) {
        return (
          <div
            className={cn(
              "bg-gray-300 rounded-md flex justify-center items-center",
              "shadow-lg",
            )}
            style={{ width: w, height: h }}
          >
            <Text variant="h3" className="opacity-30 font-medium">
              {title}
            </Text>
          </div>
        );
      }

      // Helper functions
      function toTitleCase(text) {
        return text
          .trim()
          .toLowerCase()
          .split(/\s+/)
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1))
          .join(" ");
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <App data={window.GOOGLE_DATA} />,
      );
    </script>
  </body>
</html>
